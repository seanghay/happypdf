name: Publish

# Publishes to npm when a v* tag is pushed:
#
#   npm version minor && git push --follow-tags
#
# The tag must match the version in package.json, which `npm version` guarantees.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Visual regression tests rasterise fixture pages with pdftoppm.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install
        run: npm ci

      # A tag that disagrees with package.json would publish the wrong version.
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test build output
        run: node scripts/smoke.mjs

      # Fails before publishing if the tarball is missing dist/ or the types.
      # `--ignore-scripts` keeps the prepack build off stdout, which would
      # otherwise corrupt the JSON; the Build step above already produced dist/.
      - name: Verify package contents
        run: |
          npm pack --dry-run --json --ignore-scripts > /tmp/pack.json
          node -e "
            const [pkg] = require('/tmp/pack.json');
            const names = pkg.files.map((f) => f.path);
            const required = [
              'dist/index.mjs',
              'dist/index.cjs',
              'dist/index.d.mts',
              'dist/index.d.cts',
              'dist/happypdf.min.js',
              'README.md',
              'LICENSE.md',
            ];
            const missing = required.filter((f) => !names.includes(f));
            if (missing.length) {
              console.error('Missing from tarball: ' + missing.join(', '));
              process.exit(1);
            }
            const mb = (n) => (n / 1024 / 1024).toFixed(1) + 'MB';
            console.log(
              pkg.name + '@' + pkg.version + ': ' + names.length + ' files, ' +
              mb(pkg.size) + ' tarball, ' + mb(pkg.unpackedSize) + ' unpacked'
            );
          "

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
